name: Decoder FFN initialized preflight

on:
  pull_request:
    paths:
      - '.github/workflows/decoder-ffn-preflight.yml'
      - 'docs/protocols/copy-decoder-ffn-adaptation.md'
      - 'experiments/copy_decoder_ffn_adaptation.py'
      - 'experiments/prepare_copy_decoder_ffn_adaptation.py'
      - 'experiments/run_copy_decoder_ffn_adaptation.py'
      - 'experiments/audit_copy_decoder_ffn_adaptation.py'
      - 'experiments/validate_copy_exposure_continuation.py'
      - 'results/copy_decoder_ffn_adaptation/**'
      - 'tests/safe_runner.py'
      - 'tests/test_copy_decoder_ffn_adaptation.py'
      - 'tests/test_copy_decoder_ffn_lock.py'
      - 'tests/test_copy_decoder_ffn_runner_audit.py'
      - 'requirements-cpu.txt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/decoder-ffn-preflight.yml'
      - 'docs/protocols/copy-decoder-ffn-adaptation.md'
      - 'experiments/copy_decoder_ffn_adaptation.py'
      - 'experiments/prepare_copy_decoder_ffn_adaptation.py'
      - 'experiments/run_copy_decoder_ffn_adaptation.py'
      - 'experiments/audit_copy_decoder_ffn_adaptation.py'
      - 'experiments/validate_copy_exposure_continuation.py'
      - 'results/copy_decoder_ffn_adaptation/**'
      - 'tests/safe_runner.py'
      - 'tests/test_copy_decoder_ffn_adaptation.py'
      - 'tests/test_copy_decoder_ffn_lock.py'
      - 'tests/test_copy_decoder_ffn_runner_audit.py'
      - 'requirements-cpu.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Initialized FFN preflight (Windows, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Run only explicit initialized-fixture validation
        shell: python
        run: |
          import hashlib, json, os, platform, re, subprocess, sys, time
          from pathlib import Path

          evidence = Path('results/test_runs')/('copy_ffn_ci_'+os.environ['GITHUB_RUN_ID']+'_'+os.environ['GITHUB_RUN_ATTEMPT'])
          evidence.mkdir(parents=True, exist_ok=False)
          def save(name, value):
              (evidence/name).write_text(json.dumps(value, indent=2, allow_nan=False)+'\n', encoding='utf-8')
          def execute(name, args):
              start = time.perf_counter()
              result = subprocess.run(args, capture_output=True, text=True, encoding='utf-8', errors='replace')
              (evidence/(name+'.stdout.log')).write_text(result.stdout, encoding='utf-8')
              (evidence/(name+'.stderr.log')).write_text(result.stderr, encoding='utf-8')
              save(name+'.command.json', dict(command=args, returncode=result.returncode, seconds=time.perf_counter()-start))
              print(result.stdout, end=''); print(result.stderr, end='', file=sys.stderr)
              if result.returncode:
                  raise RuntimeError(name+' failed; preserve logs and investigate without weakening checks')
              return result

          environment = dict(python=sys.version, executable=sys.executable, platform=platform.platform(),
              machine=platform.machine(), cpu=platform.processor(), runner=os.environ.get('RUNNER_NAME'),
              hosted_runner=True, user_laptop_validated=False, run_id=os.environ['GITHUB_RUN_ID'],
              run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], expected_head=os.environ['EXPECTED_HEAD'],
              preflight_declared_settings=dict(device='cpu', dtype='float64', threads=1, deterministic_algorithms=True))
          save('environment.json', environment)
          try:
              if platform.system() != 'Windows' or sys.version_info[:2] != (3, 12):
                  raise RuntimeError('This job requires native Windows and Python 3.12')
              head = execute('head', ['git', 'rev-parse', 'HEAD']).stdout.strip()
              if head != os.environ['EXPECTED_HEAD']:
                  raise RuntimeError('Checked-out commit does not match PR head')
              paths = ['requirements-cpu.txt', 'docs/protocols/copy-decoder-ffn-adaptation.md',
                  'experiments/copy_decoder_ffn_adaptation.py', 'experiments/prepare_copy_decoder_ffn_adaptation.py',
                  'experiments/run_copy_decoder_ffn_adaptation.py', 'experiments/audit_copy_decoder_ffn_adaptation.py',
                  'experiments/validate_copy_exposure_continuation.py',
                  'results/copy_decoder_ffn_adaptation/ab_replay_verification.json',
                  'results/copy_decoder_ffn_adaptation/lock.json',
                  'results/copy_decoder_ffn_adaptation/preflight.json',
                  'tests/safe_runner.py', 'tests/test_copy_decoder_ffn_adaptation.py',
                  'tests/test_copy_decoder_ffn_lock.py', 'tests/test_copy_decoder_ffn_runner_audit.py',
                  '.github/workflows/decoder-ffn-preflight.yml']
              save('source-hashes.json', {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths})
              environment['cpu_names'] = execute('cpu', ['powershell', '-NoProfile', '-Command',
                  '(Get-CimInstance Win32_Processor | Select-Object -ExpandProperty Name) -join "; "']).stdout.strip()
              save('environment.json', environment)
              execute('install', [sys.executable, '-m', 'pip', 'install', '-r', 'requirements-cpu.txt'])
              import torch
              environment.update(torch=torch.__version__, cuda_available=torch.cuda.is_available(),
                  launcher_torch_threads=torch.get_num_threads())
              save('environment.json', environment)
              execute('packages', [sys.executable, '-m', 'pip', 'freeze'])
              tests = execute('tests', [sys.executable, '-m', 'unittest', 'discover', '-s', 'tests',
                  '-p', 'test_copy_decoder_ffn_adaptation.py', '-v'])
              output = tests.stdout+'\n'+tests.stderr
              match = re.search(r'^Ran (\d+) tests? in ', output, re.MULTILINE)
              if not match or int(match.group(1)) < 11 or not re.search(r'^OK\s*$', output, re.MULTILINE):
                  raise RuntimeError('All baseline and added tests must execute without skips or expected failures')
              save('tests.result.json', dict(tests=int(match.group(1)), passed=int(match.group(1)), failures=0, errors=0, skipped=0))
              lock_tests = execute('lock-tests', [sys.executable, '-m', 'unittest', 'discover', '-s', 'tests',
                  '-p', 'test_copy_decoder_ffn_lock.py', '-v'])
              lock_output = lock_tests.stdout+'\n'+lock_tests.stderr
              lock_match = re.search(r'^Ran (\d+) tests? in ', lock_output, re.MULTILINE)
              if not lock_match or int(lock_match.group(1)) < 12 or not re.search(r'^OK\s*$', lock_output, re.MULTILINE):
                  raise RuntimeError('All synthetic lock/replay tests must execute without skips or expected failures')
              save('lock_tests.result.json', dict(tests=int(lock_match.group(1)), passed=int(lock_match.group(1)), failures=0, errors=0, skipped=0))
              runner_tests = execute('runner-tests', [sys.executable, '-m', 'unittest', 'discover', '-s', 'tests',
                  '-p', 'test_copy_decoder_ffn_runner_audit.py', '-v'])
              runner_output = runner_tests.stdout+'\n'+runner_tests.stderr
              runner_match = re.search(r'^Ran (\d+) tests? in ', runner_output, re.MULTILINE)
              if not runner_match or int(runner_match.group(1)) < 10 or not re.search(r'^OK\s*$', runner_output, re.MULTILINE):
                  raise RuntimeError('All synthetic runner/auditor tests must execute without skips or expected failures')
              save('runner_tests.result.json', dict(tests=int(runner_match.group(1)), passed=int(runner_match.group(1)), failures=0, errors=0, skipped=0))
              bundle = execute('verify-lock', [sys.executable, 'experiments/prepare_copy_decoder_ffn_adaptation.py', 'verify-lock'])
              bundle_report = json.loads(bundle.stdout)
              save('verify-lock.json', bundle_report)
              if not (bundle_report.get('passed') is True and bundle_report.get('formal_ready') is False
                  and bundle_report.get('formal_authorized') is False
                  and type(bundle_report.get('formal_updates')) is int and bundle_report.get('formal_updates') == 0
                  and bundle_report.get('ab_replay_eval_cells') == 126 and bundle_report.get('stage_records') == 8):
                  raise RuntimeError('Committed lock bundle contract mismatch')
              runner_pre = execute('runner-preflight', [sys.executable, 'experiments/run_copy_decoder_ffn_adaptation.py', 'preflight'])
              runner_pre_report = json.loads(runner_pre.stdout)
              save('runner-preflight.json', runner_pre_report)
              runner_checks = runner_pre_report.get('checks', {})
              if not (runner_pre_report.get('passed') is True and runner_pre_report.get('formal_ready') is False
                  and runner_pre_report.get('formal_authorized') is False
                  and type(runner_pre_report.get('formal_updates')) is int and runner_pre_report.get('formal_updates') == 0
                  and runner_pre_report.get('lock_verified') is True and runner_pre_report.get('auditor_reloaded') is True
                  and isinstance(runner_checks, dict) and bool(runner_checks)
                  and all(v is True for v in runner_checks.values())):
                  raise RuntimeError('Runner preflight contract mismatch')
              run = execute('preflight', [sys.executable, 'experiments/copy_decoder_ffn_adaptation.py', 'preflight'])
              report = json.loads(run.stdout)
              save('preflight.json', report)
              if not (report.get('passed') is True and report.get('formal_ready') is False
                  and type(report.get('formal_updates')) is int and report.get('formal_updates') == 0
                  and report.get('fixture_updates') == 17
                  and len(report.get('profiles', [])) == 16 and report.get('audit_cells') == 10):
                  raise RuntimeError('Preflight contract mismatch; no formal execution is permitted')
              execute('tracked-diff', ['git', 'diff', '--exit-code', 'HEAD', '--'])
              status = execute('worktree', ['git', 'status', '--porcelain', '--untracked-files=all'])
              if status.stdout.strip():
                  raise RuntimeError('Validation left unexpected repository changes')
              save('validation-status.json', dict(initialized_checks_passed=True, formal_ready=False,
                  formal_authorized=False, formal_updates=0, fixture_updates_per_preflight=17,
                  limitation='Preflight, synthetic tests, and committed lock bundle verified only; hosted Windows is not the user laptop, and historical .pt checkpoints are not present on CI. Zero formal C/D updates executed.'))
          finally:
              save('evidence-hashes.json', {str(p.relative_to(evidence)): hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in sorted(evidence.iterdir()) if p.is_file() and p.name != 'evidence-hashes.json'})
      - name: Preserve complete validation evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decoder-ffn-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/test_runs/copy_ffn_ci_*
          if-no-files-found: error
          retention-days: 30
