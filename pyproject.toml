[project]
name = "transformer-mechanism"
version = "0.0.0"
description = "Toy-scale Transformer mechanism research, audits, and bounded interventions"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

# Mirrors the pinned requirements-*.txt environments for uv workflows:
#   CPU checks / preflight: uv sync --extra cpu
#   GPU + solver suite:     UV_PROJECT_ENVIRONMENT=.venv-gpu uv sync --extra gpu --extra analysis
#   Parquet data decoder:   uv sync --extra data
# Avoid bare `uv sync` on an already-populated .venv unless you intend to strip extras.
[project.optional-dependencies]
cpu = [
    "filelock==3.32.3",
    "fsspec==2026.7.0",
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "setuptools==78.1.0",
    "sympy==1.14.0",
    "torch==2.14.0+cpu",
    "typing-extensions==4.16.0",
]
gpu = [
    "filelock==3.32.3",
    "fsspec==2026.7.0",
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "setuptools==78.1.0",
    "sympy==1.14.0",
    "torch==2.11.0+cu128",
    "typing-extensions==4.16.0",
]
analysis = [
    "numpy==2.5.3",
    "scipy==1.18.1",
]
data = [
    "pyarrow==25.0.1",
]

[tool.uv]
package = false
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pyrefly]
preset = "basic"
search-path = [".", "experiments", "tests"]
